  <style>
    /* ── Lab page design tokens (scoped; does not affect other pages) ── */
    body.lab-page {
      --lab-page-bg: #f7f7f4;
      --lab-panel: #FBFAF6;
      --lab-text: #211F1C;
      --lab-secondary: #57534A;
      --lab-muted: #8A8378;
      --lab-hairline: #D6D2C6;
      --lab-accent: #4A2E5C;
      /* Original brand button gradient (fonts stay Lab; colors restored for controls) */
      --lab-btn-gradient: linear-gradient(135deg, #c98d9a 0%, #b8a4bc 50%, #c4b4cc 100%);
      --highlight-color-button: linear-gradient(135deg, #c98d9a 0%, #b8a4bc 50%, #c4b4cc 100%);
      --highlight-color: linear-gradient(135deg, #b66072 0%, #875e8f 50%, #8b669f 100%);
      --solid-pink: #b192b7;
      --lab-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
      --lab-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --lab-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      --lab-script: 'Caveat', 'Segoe Script', 'Bradley Hand', cursive;
      --background-color: var(--lab-page-bg);
      --surface-color: var(--lab-panel);
      background-color: var(--lab-page-bg);
      color: var(--lab-text);
      font-family: var(--lab-sans);
      font-weight: 400;
    }

    body.lab-page #header {
      --nav-dropdown-background-color: var(--lab-page-bg);
      --nav-mobile-background-color: var(--lab-page-bg);
      background-color: var(--lab-page-bg);
    }

    body.lab-page .navmenu .dropdown ul {
      background: var(--lab-page-bg);
      border: 1px solid color-mix(in srgb, var(--lab-text), transparent 88%);
      box-shadow: none;
      min-width: max-content;
      width: max-content;
    }

    body.lab-page .navmenu .dropdown ul li {
      min-width: 0;
    }

    body.lab-page .navmenu .dropdown ul a {
      background: var(--lab-page-bg);
      width: 100%;
      box-sizing: border-box;
      white-space: nowrap;
    }

    @media (min-width: 1200px) {
      body.lab-page .navmenu .dropdown .dropdown ul {
        top: 0;
        left: auto;
        right: 100%;
        visibility: hidden;
        width: max-content;
        min-width: max-content;
      }

      body.lab-page .navmenu .dropdown .dropdown:hover > ul {
        top: 0;
        left: auto;
        right: 100%;
        visibility: visible;
      }
    }

    /* Form controls inherit page font (fixes native "Order by" dropdown) */
    body.lab-page select,
    body.lab-page input,
    body.lab-page button,
    body.lab-page textarea {
      font-family: inherit;
    }

    /* Lab tool surface */
    body.lab-page .main,
    body.lab-page #container {
      overflow: visible;
    }

    body.lab-page #container {
      font-family: var(--lab-sans);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--lab-text);
      max-width: 1400px;
    }

    body.lab-page #container .lab-workspace {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    body.lab-page #container .lab-settings-rail {
      width: 248px;
    }

    body.lab-page #container .lab-settings-rail-inner {
      position: fixed;
      top: 100px;
      width: 248px;
      max-height: calc(100vh - 116px);
      overflow-y: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-right: 16px;
      padding-bottom: 8px;
      border-right: 0.5px solid var(--lab-hairline, #D6D2C6);
      background: var(--lab-page-bg);
      z-index: 2;
    }

    body.lab-page #container .lab-main-column {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    body.lab-page #container .lab-roi-stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 16px;
      height: 280px;
    }

    body.lab-page #container .lab-roi-viewer,
    body.lab-page #container .lab-roi-card-wrap {
      min-height: 0;
      height: 100%;
    }

    body.lab-page #container .lab-roi-viewer-coming-soon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      font-family: var(--lab-serif);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--lab-text);
      text-align: center;
      padding: 0 16px;
      text-shadow: 0 0 16px var(--lab-panel), 0 0 8px var(--lab-panel);
    }

    body.lab-page #container .lab-roi-card-wrap .MuiCard-root,
    body.lab-page #container .lab-model-card-wrap .MuiCard-root {
      aspect-ratio: auto;
      height: 100%;
    }

    body.lab-page #container .lab-model-card-wrap {
      width: 100%;
      margin-top: 8px;
    }

    body.lab-page #container .lab-model-card-wrap .MuiCard-root {
      aspect-ratio: 1 / 1;
      height: auto;
    }

    body.lab-page #container .lab-model-card {
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      padding: 18px 16px 14px !important;
    }

    body.lab-page #container .lab-model-card-name {
      display: block;
      margin: 10px 0 0;
      font-family: var(--lab-mono);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.25;
      background: var(--highlight-color);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: underline;
      text-decoration-color: color-mix(in srgb, var(--lab-accent) 45%, transparent);
      text-underline-offset: 3px;
    }

    body.lab-page #container .lab-model-card-name:hover {
      text-decoration-color: var(--lab-accent);
    }

    body.lab-page #container .lab-model-card-type {
      margin: 6px 0 0;
      font-family: var(--lab-sans);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.35;
      color: var(--lab-secondary);
    }

    body.lab-page #container .lab-model-card-rank {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding: 10px 0 8px;
    }

    body.lab-page #container .lab-stat-number {
      display: block;
      font-family: var(--lab-script);
      font-style: italic;
      font-size: 3rem;
      font-weight: 600;
      color: var(--lab-accent);
      line-height: 0.95;
    }

    body.lab-page #container .lab-model-card-rank-lines {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      margin-top: 6px;
    }

    body.lab-page #container .lab-model-card-rank-meta,
    body.lab-page #container .lab-model-card-rank-scope,
    body.lab-page #container .lab-model-card-rank-fallback,
    body.lab-page #container .lab-model-card-link {
      font-family: var(--lab-mono);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.4;
    }

    body.lab-page #container .lab-model-card-rank-meta {
      color: var(--lab-text);
    }

    body.lab-page #container .lab-model-card-rank-scope {
      margin-top: 2px;
      color: var(--lab-muted);
      text-transform: uppercase;
    }

    body.lab-page #container .lab-model-card-rank-fallback {
      margin: 0;
      color: var(--lab-secondary);
    }

    body.lab-page #container .lab-model-card-link {
      margin-top: 8px;
      color: var(--lab-accent);
      text-decoration: none;
    }

    body.lab-page #container .lab-model-card-link:hover {
      text-decoration: underline;
    }

    body.lab-page #container .lab-roi-card-description {
      margin: 0;
      font-family: var(--lab-sans);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--lab-text);
    }

    body.lab-page #container .lab-roi-card .lab-model-card-rank-lines {
      margin-top: auto;
    }

    body.lab-page #container .lab-stimuli-canvas {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    body.lab-page #container .lab-preload-inline {
      padding: 12px;
      border: 0.5px solid var(--lab-hairline, #D6D2C6);
      border-radius: 8px;
      background: var(--lab-panel, #FBFAF6);
    }

    body.lab-page #container .lab-run-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    body.lab-page #container .lab-froi-grid {
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    body.lab-page #container .lab-eyebrow,
    body.lab-page #container .MuiFormLabel-root.lab-eyebrow,
    body.lab-page #container .MuiTypography-root.lab-eyebrow {
      display: block;
      font-family: var(--lab-mono) !important;
      font-size: 11px !important;
      font-weight: 400 !important;
      letter-spacing: 0.06em !important;
      text-transform: uppercase !important;
      color: var(--lab-muted) !important;
      line-height: 1.3 !important;
      margin: 0;
    }

    body.lab-page #container #region-buttons-group-label.lab-eyebrow,
    body.lab-page #container #lab-advanced-settings-label.lab-eyebrow {
      font-size: 12px !important;
      color: var(--lab-secondary) !important;
    }

    body.lab-page #container .lab-heading {
      display: block;
      font-family: var(--lab-serif);
      font-size: 19px;
      font-weight: 600;
      color: var(--lab-text);
      line-height: 1.3;
      margin: 8px 0 0;
    }

    /* Stepper tab: title matches section headings; numbers use handwritten italic */
    body.lab-page #container .lab-step-title {
      font-family: var(--lab-serif);
      font-size: 19px;
      font-weight: 600;
      color: var(--lab-text);
      line-height: 1.3;
    }

    body.lab-page #container .lab-step-num {
      font-family: var(--lab-script);
      font-style: italic;
      font-size: 30px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.02em;
      color: var(--lab-secondary);
    }

    body.lab-page #container .lab-step-tab.is-active .lab-step-num {
      color: var(--lab-accent);
    }

    body.lab-page #container .lab-step-tab.is-upcoming .lab-step-title {
      color: var(--lab-muted);
    }

    body.lab-page #container .lab-step-tab.is-upcoming .lab-step-num {
      color: var(--lab-muted);
    }

    body.lab-page #container .lab-section-header {
      margin: 40px 0 12px;
      text-align: left;
    }

    body.lab-page #container .lab-section-header:first-child {
      margin-top: 0;
    }

    body.lab-page #container .lab-mono-id {
      font-family: var(--lab-mono);
      font-weight: 400;
    }

    body.lab-page #container .lab-mono-num {
      font-family: var(--lab-mono);
      font-weight: 500;
    }

    body.lab-page #container .lab-secondary-btn {
      background: transparent;
      border: 0.5px solid var(--lab-hairline);
      color: var(--lab-text);
      border-radius: 5px;
      padding: 9px 16px;
      font-family: var(--lab-sans);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      box-shadow: none;
      text-transform: none;
    }

    body.lab-page #container .lab-secondary-btn:hover:not(:disabled) {
      background: rgba(33, 31, 28, 0.03);
    }

    body.lab-page #container .lab-secondary-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    body.lab-page #container .lab-secondary-btn:focus-visible {
      outline: 2px solid var(--lab-accent);
      outline-offset: 2px;
    }

    /* MUI / Ant — Inter 400/500 only, no weight 700 */
    body.lab-page .MuiTypography-root,
    body.lab-page .MuiButtonBase-root,
    body.lab-page .MuiButton-root,
    body.lab-page .MuiFormControlLabel-label,
    body.lab-page .MuiInputBase-root,
    body.lab-page .MuiInputLabel-root,
    body.lab-page .MuiMenuItem-root,
    body.lab-page .MuiSelect-root,
    body.lab-page .MuiFormLabel-root,
    body.lab-page .MuiAccordionSummary-content,
    body.lab-page .ant-typography,
    body.lab-page .ant-btn,
    body.lab-page .ant-upload-text,
    body.lab-page .ant-upload-hint,
    body.lab-page .ant-progress-text,
    body.lab-page #container button,
    body.lab-page #container [class*="ant-"] {
      font-family: var(--lab-sans) !important;
      font-weight: 400;
    }

    body.lab-page .MuiButton-root,
    body.lab-page .ant-btn {
      font-size: 13px !important;
      font-weight: 500 !important;
      text-transform: none !important;
    }

    body.lab-page .MuiInputLabel-root {
      font-size: 15px !important;
      font-weight: 500 !important;
      text-transform: none !important;
    }

    body.lab-page .MuiSelect-select,
    body.lab-page .MuiMenuItem-root {
      font-size: 15px !important;
    }

    body.lab-page #container .ant-btn-primary {
      background: var(--lab-btn-gradient) !important;
      border: none !important;
      color: #ffffff !important;
      box-shadow: none !important;
      border-radius: 5px !important;
    }

    body.lab-page #container .ant-btn-primary:hover:not(:disabled),
    body.lab-page #container .ant-btn-primary:focus:not(:disabled) {
      background: var(--lab-btn-gradient) !important;
      filter: brightness(0.96);
      color: #ffffff !important;
    }

    body.lab-page #container .ant-progress-bg {
      background: var(--lab-btn-gradient) !important;
    }

    body.lab-page #container .ant-btn-default {
      background: transparent !important;
      border: 0.5px solid var(--lab-hairline) !important;
      color: var(--lab-text) !important;
      border-radius: 5px !important;
      box-shadow: none !important;
    }

    /* Upload + preload panels: match Lab hairline / type */
    body.lab-page #container .lab-upload-column-panel {
      border: 0.5px solid var(--lab-hairline);
      border-radius: 5px;
      background: transparent;
      padding: 14px;
    }

    body.lab-page #container .ant-upload.ant-upload-drag {
      border: 0.5px solid var(--lab-hairline) !important;
      border-radius: 5px !important;
      background: transparent !important;
    }

    body.lab-page #container .ant-upload.ant-upload-drag:hover,
    body.lab-page #container .ant-upload.ant-upload-drag:focus {
      border-color: var(--lab-secondary) !important;
      background: rgba(33, 31, 28, 0.02) !important;
    }

    body.lab-page #container .ant-upload-drag-icon .anticon {
      color: var(--lab-secondary) !important;
    }

    body.lab-page #container .ant-upload-text {
      font-family: var(--lab-sans) !important;
      font-size: 18px !important;
      font-weight: 500 !important;
      color: var(--lab-text) !important;
      line-height: 1.4 !important;
      margin-bottom: 0 !important;
    }

    body.lab-page #container .ant-upload-hint,
    body.lab-page #container .ant-upload-hint .ant-typography {
      font-family: var(--lab-sans) !important;
      font-size: 13px !important;
      font-weight: 400 !important;
      color: var(--lab-muted) !important;
      line-height: 1.6 !important;
      margin-top: 18px !important;
      padding-top: 4px;
    }

    body.lab-page #container .ant-upload-hint .gradient-link {
      transition: filter 0.2s ease, transform 0.2s ease, text-decoration-color 0.2s ease;
      text-underline-offset: 3px;
    }

    body.lab-page #container .ant-upload-hint .gradient-link .gradient-text {
      text-decoration: underline;
      text-decoration-color: transparent;
      text-decoration-thickness: 1.5px;
      transition: text-decoration-color 0.2s ease, filter 0.2s ease;
    }

    body.lab-page #container .ant-upload-hint .gradient-link:hover {
      filter: brightness(0.88) saturate(1.25);
      transform: translateY(-1px);
    }

    body.lab-page #container .ant-upload-hint .gradient-link:hover .gradient-text {
      text-decoration-color: currentColor;
      -webkit-text-fill-color: transparent;
      filter: brightness(0.9);
    }

    body.lab-page #container .ant-upload-hint .gradient-link:hover .highlight-icon {
      transform: translateY(3px) scale(1.12);
      color: var(--lab-accent) !important;
    }

    body.lab-page #container .lab-preload-column-panel .ant-btn {
      border-radius: 5px !important;
      font-family: var(--lab-sans) !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      text-align: left !important;
    }

    body.lab-page #footer {
      background: var(--lab-page-bg);
    }

    body.lab-page .scroll-top {
      width: 28px;
      height: 28px;
      left: auto;
      right: 24px;
      bottom: 24px;
      border-radius: 5px;
      z-index: 2147483643;
      background-color: var(--lab-secondary, #57534A);
      box-shadow: 0 4px 12px rgba(34, 30, 26, 0.12);
    }

    body.lab-page .cortex-tutorial-card {
      background: rgba(251, 250, 246, 0.72) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    body.lab-page .scroll-top i {
      font-size: 16px;
      color: #fff;
    }

    body.lab-page .scroll-top:hover {
      background-color: var(--lab-accent, #4A2E5C);
      filter: none;
    }

    /* Desktop: keep fROI chips in a 3-column grid */
    @media (min-width: 769px) {
      body.lab-page #container .lab-froi-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      }
    }

    /* ── Mobile / portrait ── */
    @media (max-width: 768px) {
      body.lab-page #container {
        padding-left: 12px;
        padding-right: 12px;
        padding-bottom: 96px;
        box-sizing: border-box;
      }

      body.lab-page #container .lab-upload-columns {
        grid-template-columns: 1fr !important;
        gap: 12px !important;
      }

      body.lab-page #container .lab-upload-column-panel {
        padding: 12px;
      }

      body.lab-page #container .ant-upload-text {
        font-size: 16px !important;
      }

      body.lab-page #container .ant-upload-hint {
        margin-top: 12px !important;
        font-size: 12px !important;
      }

      body.lab-page #container .lab-workspace {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      body.lab-page #container .lab-settings-rail {
        width: auto;
        min-height: 0;
        padding-right: 0;
        border-right: none;
        border-bottom: 0.5px solid var(--lab-hairline, #D6D2C6);
        padding-bottom: 16px;
      }

      body.lab-page #container .lab-settings-rail-inner {
        position: static;
        top: auto;
        width: auto;
        max-height: none;
        overflow: visible;
        padding-right: 0;
        padding-bottom: 0;
        border-right: none;
        background: transparent;
      }

      body.lab-page #container .lab-roi-stage {
        grid-template-columns: 1fr;
        height: auto;
      }

      body.lab-page #container .lab-roi-viewer {
        height: 260px;
      }

      body.lab-page #container .lab-roi-card-wrap .MuiCard-root {
        aspect-ratio: 1 / 1;
        height: auto;
      }

      body.lab-page #container .lab-step-title {
        font-size: 12px;
        line-height: 1.2;
      }

      body.lab-page #container .lab-step-num {
        font-size: 22px;
      }

      body.lab-page #container [data-tutorial="lab-stepper-nav"] {
        overflow-x: visible;
      }

      body.lab-page #container .lab-run-row .ant-btn-primary {
        width: auto;

      }

      body.lab-page #container .lab-froi-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      }

      body.lab-page #container .lab-froi-grid > button {
        min-width: 0 !important;
        font-size: 12px !important;
        padding: 10px 4px !important;
      }

      body.lab-page #container .lab-heading {
        font-size: 17px;
      }

      body.lab-page #container .ant-btn-primary {
        width: 100%;
      }

      body.lab-page .scroll-top {
        right: 16px;
        bottom: 62px;
      }

      body.lab-page #container .lab-groups-grid {
        grid-template-columns: 1fr !important;
      }

      body.lab-page #container .lab-groups-grid input {
        width: 100% !important;
        max-width: 100% !important;
      }
    }

    @media (max-width: 480px) {
      body.lab-page #container [role="group"][aria-labelledby="region-buttons-group-label"] > button {
        flex: 1 1 calc(50% - 6px) !important;
      }

      body.lab-page #container .lab-step-title {
        font-size: 11px;
      }
    }

  </style>

<body class="lab-page">
